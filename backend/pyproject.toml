[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "B", "S"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "app.access.require_role"]   # приёмы FastAPI в аргументах

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "E702"]   # assert, тестовые «пароли» и плотные тесты допустимы
