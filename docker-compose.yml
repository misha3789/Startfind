# Startfind: PostgreSQL + backend. Запуск: cp .env.example .env && docker compose up --build
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: startfind
      POSTGRES_PASSWORD: startfind
      POSTGRES_DB: startfind
    ports:
      - "127.0.0.1:5432:5432"   # только локально; на стенде порт наружу не открывать
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U startfind -d startfind"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Внутри сети compose база доступна по имени сервиса db, а не localhost.
      DATABASE_URL: postgresql+psycopg://startfind:startfind@db:5432/startfind
      # backend не стартует с пустым BOT_TOKEN, а в .env.example он пустой: для локального запуска
      # подставляется заглушка. ТОЛЬКО для разработки: заглушка публична, на стенде BOT_TOKEN обязателен.
      BOT_TOKEN: ${BOT_TOKEN:-local-dev-token}
      INIT_DATA_MAX_AGE: ${INIT_DATA_MAX_AGE:-86400}
    volumes:
      - ./docs:/docs:ro   # docs/skills.csv для seed-скрипта
    ports:
      - "8000:8000"
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app_factory --factory --host 0.0.0.0 --port 8000"

volumes:
  pgdata:
