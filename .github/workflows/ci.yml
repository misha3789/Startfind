name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: startfind
          POSTGRES_PASSWORD: startfind
          POSTGRES_DB: startfind_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U startfind -d startfind_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://startfind:startfind@localhost:5432/startfind_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt ruff==0.17.6
      - name: Static analysis (ruff)
        run: ruff check .
      - name: Tests
        run: pytest
